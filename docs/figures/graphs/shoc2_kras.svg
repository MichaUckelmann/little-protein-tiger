level view; spelling variants merged. Edge width counts distinct papers. Drawn: edges between a protein of interest and its</text><text x="24" y="678" font-size="12" fill="#666">strongest partners (84 partners in the corpus); edges among partners are omitted. DepMap r: Pearson correlation of CRISPR gene</text><text x="24" y="694" font-size="12" fill="#666">effect over 1,208 cell lines. Kd, Ki: tightest value reported for the wild-type protein.</text><text x="24" y="710" font-size="12" fill="#666">This pair was forwarded in 2 of 2 KRAS runs in the wildcard evaluation.</text></svg>