# Adapted from `example/cylcic_against_kras_with_specific_site/cyclicdesign.yaml`
# in https://github.com/HannesStark/boltzgen (branch `main`, retrieved
# 2026-05-21): MIT License, Copyright (c) 2025 Hannes Stärk. Full licence text
# in THIRD_PARTY_LICENSES.md. Changes: LPT structure paths, LPT-specific
# comments, and the cyclic peptide length range LPT's config uses.
entities:
  # Specification of the target which is extracted from a .cif file
  - file:
      path: data/structures/6g6k.cif

      # Which chain and residues in the .cif file to use as target (uses all chains if unspecified)
      include:
        - chain:
            id: A

      # Which regions of the target the design should or should NOT
      # bind to (this can be left unspecified, then we just bind anywhere)
      binding_types:
        - chain:
            id: A
            binding: 27,53,34,31,60
  # A designed cyclic peptide with 12-15 residues
  - protein:
      id: F
      sequence: 12..15
      cyclic: True