# ---------------------------------------------------------------------------
# Enzyme design / chemistry / computational chemistry search expansion.
#
# Used with:  python scripts/fetch_papers.py --config config_enzyme_chemistry.yaml
# then:       python scripts/curate_papers.py --config config_enzyme_chemistry.yaml --provider gemini --limit 1000
#
# Paths intentionally match config.yaml so curated enzyme/chemistry papers join
# the SAME corpus (data/literature.db, data/fingerprints, data/vectors). The
# broadened curation_prompt.md + enzyme_context schema capture the new concepts.
# ---------------------------------------------------------------------------

keywords:

  # --- De novo / computational enzyme design ---
  - "de novo enzyme design[Title/Abstract]"
  - "computational enzyme design[Title/Abstract] AND active site[Title/Abstract]"
  - "theozyme[Title/Abstract]"
  - "catalytic antibody[Title/Abstract] AND transition state[Title/Abstract]"
  - "RFdiffusion[Title/Abstract] AND enzyme[Title/Abstract]"
  - "LigandMPNN[Title/Abstract]"
  - "deep learning[Title/Abstract] AND enzyme design[Title/Abstract]"
  - "active site[Title/Abstract] AND scaffold[Title/Abstract] AND catalysis[Title/Abstract]"
  - "artificial enzyme[Title/Abstract] AND design[Title/Abstract]"
  - "Rosetta[Title/Abstract] AND enzyme design[Title/Abstract]"

  # --- Enzyme mechanism & catalysis ---
  - "enzyme mechanism[Title/Abstract] AND transition state[Title/Abstract]"
  - "catalytic residues[Title/Abstract] AND active site[Title/Abstract]"
  - "oxyanion hole[Title/Abstract]"
  - "general base catalysis[Title/Abstract] AND enzyme[Title/Abstract]"
  - "covalent catalysis[Title/Abstract] AND enzyme mechanism[Title/Abstract]"
  - "metalloenzyme[Title/Abstract] AND active site[Title/Abstract] AND mechanism[Title/Abstract]"
  - "enzyme kinetics[Title/Abstract] AND kcat[Title/Abstract]"
  - "transition state analogue[Title/Abstract] AND enzyme[Title/Abstract]"

  # --- Directed evolution / enzyme engineering / biocatalysis ---
  - "directed evolution[Title/Abstract] AND enzyme[Title/Abstract]"
  - "enzyme engineering[Title/Abstract] AND activity[Title/Abstract]"
  - "biocatalysis[Title/Abstract] AND enzyme[Title/Abstract]"
  - "new-to-nature[Title/Abstract] AND enzyme[Title/Abstract]"
  - "non-natural reaction[Title/Abstract] AND enzyme catalysis[Title/Abstract]"
  - "enzyme promiscuity[Title/Abstract] AND evolution[Title/Abstract]"
  - "biocatalytic[Title/Abstract] AND stereoselective[Title/Abstract] AND synthesis[Title/Abstract]"

  # --- Specific designed-reaction systems (Baker/Hilvert/Houk lineages) ---
  - "Kemp eliminase[Title/Abstract]"
  - "retro-aldolase[Title/Abstract] AND design[Title/Abstract]"
  - "Diels-Alderase[Title/Abstract]"
  - "designed[Title/Abstract] AND Michael addition[Title/Abstract] AND enzyme[Title/Abstract]"
  - "carbene transferase[Title/Abstract] OR nitrene transferase[Title/Abstract]"

  # --- Computational chemistry / QM of enzymatic reactions ---
  - "QM/MM[Title/Abstract] AND enzyme[Title/Abstract] AND reaction[Title/Abstract]"
  - "density functional theory[Title/Abstract] AND reaction mechanism[Title/Abstract] AND enzyme[Title/Abstract]"
  - "transition state[Title/Abstract] AND DFT[Title/Abstract] AND catalysis[Title/Abstract]"
  - "free energy[Title/Abstract] AND enzyme catalysis[Title/Abstract] AND simulation[Title/Abstract]"
  - "activation barrier[Title/Abstract] AND organic reaction[Title/Abstract] AND computational[Title/Abstract]"
  - "reaction mechanism[Title/Abstract] AND quantum chemistry[Title/Abstract]"
  - "ORCA[Title/Abstract] AND transition state[Title/Abstract] AND mechanism[Title/Abstract]"

search:
  max_results_per_query: 200
  ncbi_pmc: true
  europepmc_sources: ["ppr"]
  semantic_scholar: true

paths:
  pdf_dir: "data/pdfs"
  db_path: "data/literature.db"
  fingerprint_dir: "data/fingerprints"
  structures_dir: "data/structures"

quality:
  exclude_pub_types:
    - "Congress"
    - "Meeting Abstract"
  min_score_to_download: 0.0
  # Tiered-journal gate ON: the chemistry/catalysis venues added to
  # src/ranking.py (Nature Catalysis, ACS Catalysis, JACS, JCTC, ...) now pass
  # this gate. Set false for a broader (noisier) sweep.
  require_tiered_journal: true
  tier1_extra: []
  tier2_extra: []

curation:
  provider: "claude"            # override per-run with --provider gemini
  model: "claude-haiku-4-5"
  gemini_model: "gemini-3.1-flash-lite"
  local_model: "gemma4:26b-a4b-it-q4_K_M"
  local_endpoint: "http://localhost:11434/v1"
  local_sampling:
    temperature: 0.1
    top_p: 0.95
    reasoning_effort: "none"
    response_format: {type: "json_object"}
  local_options:
    num_ctx: 65536
  local_request_timeout: 900
  max_tokens: 8000
  max_input_chars: 150000
  delay_s: 1.0
  max_retries: 3
  prompt_path: "curation_prompt.md"
  schema_path: "extraction_schema.json"

rate_limits:
  europepmc_delay_s: 0.5
  ncbi_delay_s: 0.34
  s2_delay_s: 1.1
  download_delay_s: 1.0
  max_retries: 3

vector_store:
  db_path: "data/vectors"
  embedding_model: "NeuML/pubmedbert-base-embeddings"
  top_k_default: 5
