# ---------------------------------------------------------------------------
# Quality scoring
# ---------------------------------------------------------------------------
quality:
  # Extra journals to add to tier 1 (score 1.0) beyond the built-in list.
  # Use the journal name exactly as it appears in NCBI (usually abbreviated).
  tier1_extra: []

  # Extra journals to add to tier 2 (score 0.7).
  tier2_extra: []

  # Papers with these NCBI pub types are excluded from downloads entirely.
  # Conference abstracts have PMCIDs but no individual files on AWS.
  exclude_pub_types:
    - "Congress"
    - "Meeting Abstract"

  # Minimum priority_score to attempt download (0.0 = download everything).
  min_score_to_download: 0.0

  # Restrict downloads to papers from journals in the tier 1/2 list only
  # (src/ranking.py). Search still INDEXES every hit, so widening this later
  # and re-running fetch_papers.py needs no re-search.
  #
  # On the shipped corpus this gate passes 32% of indexed papers; turning it
  # off multiplies downloads ~3.1x, with matching curation cost and disk.
  # See docs/journal-filtering.md for the tier lists, what is excluded, and
  # how to extend them (tier1_extra / tier2_extra above).
  require_tiered_journal: true

# ---------------------------------------------------------------------------
# Search keywords
# ---------------------------------------------------------------------------
keywords:
  # Gap: developmental biology
  - "histone chaperone[Title/Abstract] AND mechanism[Title/Abstract]"
  - "histone chaperone[Title/Abstract] AND structure[Title/Abstract]"
  - "histone chaperone[Title/Abstract] AND biochemistry[Title/Abstract]"
  - "H2A[Title/Abstract] AND H2B[Title/Abstract] AND chaperone[Title/Abstract]"
  - "FACT[Title/Abstract] AND H2A[Title/Abstract] AND H2B[Title/Abstract]"
  - "histone chaperones[Title/Abstract] AND epigenetics[Title/Abstract]"
  - "NAP1[Title/Abstract] AND H2A[Title/Abstract] AND H2B[Title/Abstract]"
  - "NAP1[Title/Abstract] AND chaperone[Title/Abstract]"
  - "H2A[Title/Abstract] AND chaperone[Title/Abstract]"
  - "histone chaperone[Title/Abstract] AND molecular mechanism[Title/Abstract]"
  - "H2A[Title/Abstract] AND chaperone[Title/Abstract] AND molecular mechanism[Title/Abstract]"
  - "FACT[Title/Abstract] AND histone[Title/Abstract]"
  - "NAP1[Title/Abstract] AND histone[Title/Abstract]"
  - "FACT[Title/Abstract] AND structure[Title/Abstract] AND histone[Title/Abstract]"
  - "H2A[Title/Abstract] AND chaperone[Title/Abstract] AND structure[Title/Abstract]"
  - "H2B[Title/Abstract] AND chaperone[Title/Abstract]"

  


 
search:
  max_results_per_query: 200
  # NCBI eSearch covers PMC full-text articles (including those indexed as
  # MEDLINE in Europe PMC that HAS_FT:Y / SRC:PMC would miss)
  ncbi_pmc: true
  # Europe PMC covers preprints (bioRxiv / medRxiv)
  europepmc_sources: ["ppr"]
  # Semantic Scholar: discovers OA papers outside PMC and provides citation counts
  # for ranking.  Requires S2_API_KEY env var for best rate limits.
  semantic_scholar: true

paths:
  pdf_dir: "data/pdfs"
  db_path: "data/literature.db"
  fingerprint_dir: "data/fingerprints"
  structures_dir: "data/structures"

# ── Model selection + pricing ────────────────────────────────────────────────
# Single source of truth for which model each pipeline stage uses and what it
# costs.  src/pipeline_runner.py falls back to its own _DEFAULT_* tables when a
# key is absent here, so this block is optional but authoritative.
#
# NOTE: extended thinking on these models is ADAPTIVE — `budget_tokens` was
# removed on claude-sonnet-5 / claude-opus-5 and is rejected with a 400.
models:
  # Default provider for every pipeline stage (PipelineRunner's `provider`
  # constructor default and --provider CLI default) is now "gemini" —
  # gemini-3.7-flash below. Not just cost (~4x cheaper input than Sonnet):
  # this run's own live evidence is claude-sonnet-5 refusing (category
  # "bio") on BOTH the target_intel and interface stages for a routine
  # antagonist-design query, each refusal burning real spend (one cost
  # $1.10 for nothing — see `refusal_fallbacks` below) before falling
  # through to Gemini, which then answered cleanly every time. Going
  # straight to Gemini skips paying for that failure. `--provider claude`
  # still selects the Claude path in full, `models.claude.*` below is
  # unchanged and still authoritative for it.
  claude:
    default: "claude-sonnet-5"
    # Haiku cannot do extended thinking; stages requesting it upgrade to this.
    thinking_upgrade: "claude-sonnet-5"
    # Retry here when a safety classifier declines a request. Refusals are
    # strongly model-dependent: on the complex-structure-analysis prompt,
    # claude-sonnet-5 refuses with category "bio"; claude-opus-5 answers for some
    # targets and declines for others, so this is a chain tried in order.
    # Tried in order when a safety classifier declines. A fallback entry may name
    # another provider as "provider:model".
    #
    # Gemini goes FIRST, not last — an earlier version tried Claude
    # alternates before crossing providers, and that measurably wastes both
    # tokens and wall-clock. Ledger evidence from three separate interface-
    # stage refusals on one target (PD-L1): claude-sonnet-5 refused (category
    # "bio"), then claude-opus-5 ALSO refused (same category), every time,
    # $0.13 spent for nothing each time, before claude-haiku-4-5 finally
    # answered. Anthropic's safety classifiers are consistent across the
    # Claude family for a given category, so a same-provider retry after a
    # categorised refusal is a bet that has not once paid off here.
    #
    # gemini-3.7-flash answers reliably and is ~4x cheaper on input than
    # sonnet. claude-opus-5 / claude-haiku-4-5 remain as later fallbacks only
    # for the rare case Gemini itself declines or errors (see the
    # SkillRefusedError handling added to `_run_gemini` for that case) —
    # reached only when switching provider does not resolve it either.
    refusal_fallbacks: ["gemini:gemini-3.7-flash", "claude-opus-5", "claude-haiku-4-5"]
    stages:
      # Sonnet-class models trigger a biosecurity refusal on the "review of
      # designed binders" task regardless of prompt wording; Haiku handles the
      # tabular summarisation correctly and ~3x cheaper.
      summary: "claude-haiku-4-5"
      binder_summary: "claude-haiku-4-5"
      # A per-stage override may name another PROVIDER as "provider:model".
      # The binder track's `interface` stage is declined by claude-sonnet-5 and
      # often by claude-opus-5 with category "bio"; claude-haiku-4-5 answers but
      # cannot reliably produce the MODEL-READY HOTSPOTS table the next stage
      # parses. Gemini answers and is ~4x cheaper on input.
      # interface: "gemini:gemini-3.7-flash"   # force it; normally a fallback
  gemini:
    default: "gemini-3.7-flash"
    # If gemini-3.7-flash itself declines (SkillRefusedError from
    # `_run_gemini` — an empty-candidates / promptFeedback.blockReason /
    # per-candidate SAFETY-class finishReason), fall through to Claude
    # rather than retrying Gemini itself; this is the primary chain now
    # that gemini is the default provider, mirroring the claude block's
    # own refusal_fallbacks above (which still leads with Gemini for the
    # `--provider claude` path).
    refusal_fallbacks: ["claude-opus-5", "claude-haiku-4-5"]

  # USD per 1M tokens.  Cache multipliers apply to the INPUT rate:
  # cache writes bill at ~1.25x (5-minute TTL; use 2.0 for a 1h TTL) and cache
  # reads at ~0.10x.  The API reports uncached input, cache-write and cache-read
  # as separate buckets, so they are priced separately — never summed.
  pricing:
    claude-opus-5:      {input: 5.00,  output: 25.00}
    claude-sonnet-5:    {input: 3.00,  output: 15.00}   # $2/$10 intro rate through 2026-08-31
    claude-haiku-4-5:   {input: 1.00,  output: 5.00}
    claude-fable-5:     {input: 10.00, output: 50.00}
    gemini-3.7-flash:              {input: 0.75, output: 3.75}   # intro rate through 2026-12-31; 1.50/7.50 after
    gemini-3.1-flash-lite:         {input: 0.10, output: 0.40}
    # Retired name, kept so ledger lines written before the GA rename
    # still price rather than logging as unpriced.
    gemini-3.1-flash-lite-preview: {input: 0.10, output: 0.40}

curation:
  provider: "claude"            # "claude" | "gemini" | "local". Override per-run with --provider.
  model: "claude-haiku-4-5"    # options: "claude-haiku-4-5" and "claude-sonnet-5"
  gemini_model: "gemini-3.7-flash"  # used when provider = "gemini"
  # alternatives: "gemini-3-flash-preview" (standard), "gemini-3.1-flash-lite" (high-volume/lower-cost)

  # ── Local provider ────────────────────────────────────────────────────────
  # Default points at Ollama's OpenAI-compatible endpoint.
  # For vLLM/SGLang, switch local_endpoint to http://localhost:8000/v1 and set
  # local_model to the HF id (e.g. "Qwen/Qwen3.5-9B").
  local_model: "gemma4:26b-a4b-it-q4_K_M"
  local_endpoint: "http://localhost:11434/v1"
  # Sampling knobs merged into the request body. Low temperature for strict
  # structured extraction; response_format pins Ollama into JSON-only mode.
  # reasoning_effort=none disables Gemma 4's thinking mode — without it the
  # model dumps everything into a `reasoning` field and `content` stays empty
  # until reasoning ends, blowing through max_tokens before producing output.
  local_sampling:
    temperature: 0.1
    top_p: 0.95
    reasoning_effort: "none"
    response_format: {type: "json_object"}
  # Ollama-specific nested options. num_ctx must be large enough to hold
  # system prompt (~5k tok) + max_input_chars/4 input tok + max_tokens output.
  # At 150 000 chars input this is ~50k tokens total → 65 536 ctx is safe.
  local_options:
    num_ctx: 65536
  local_request_timeout: 900    # seconds; local generation is slower than cloud

  max_tokens: 8000
  max_input_chars: 150000       # raised from 90 000 — fits in num_ctx 65 536
  delay_s: 1.0
  max_retries: 3
  prompt_path: "curation_prompt.md"
  schema_path: "extraction_schema.json"

rate_limits:
  europepmc_delay_s: 0.5
  ncbi_delay_s: 0.34        # ~3 req/s without API key; auto-speeds to 0.1 with NCBI_API_KEY
  s2_delay_s: 1.1           # ~1 req/s without S2_API_KEY; auto-reduces to 0.2 with key
  download_delay_s: 1.0
  max_retries: 3

vector_store:
  db_path: "data/vectors"
  embedding_model: "NeuML/pubmedbert-base-embeddings"
  top_k_default: 5

# ---------------------------------------------------------------------------
# Design execution (workstation, stages 4-6)
# ---------------------------------------------------------------------------
# Stage 4 (execution) is deterministic: src/design_runner.py wraps
# `boltzgen check` + `boltzgen run` as a blocking subprocess on this machine.
# Pilot then production, using BoltzGen's --reuse flag so production extends
# the pilot output in place (no double-billing of GPU time).
design:
  # Stage 0 (pathway) skill selection. "standard" = pathway-expert (default,
  # validated-target-biased); "wildcard" = wildcard-expert (graph-driven
  # novelty triage, prefers HYPOTHESIS/SYNTHETIC_LETHALITY/CROSS_INDICATION_TRANSFER
  # tiers when tractable). CLI --pathway-mode overrides this value when set.
  pathway:
    mode: standard

  # --workflow ppi ONLY (the binder track always runs foundry regardless of
  # this key). "foundry" (the default) or "boltzgen" (src/design_runner.py)
  # (foundry hands off to the same RFD3 -> solubleMPNN -> RF3 stage machine
  # --workflow binder uses, right after PPI's own structure stage — see
  # PipelineRunner._bridge_ppi_to_foundry and UNIFY_DESIGN_BACKEND_NOTES.md).
  # DEFAULT since the bridge was validated on a real KRAS/RAF1 GPU campaign:
  # both --workflow ppi and --workflow binder now run the same RFD3 ->
  # solubleMPNN -> RF3 machine, so a target discovered by the PPI stages is
  # designed the same way as one named directly. CLI --design-engine overrides
  # this; foundry requires --project.
  #
  # 'boltzgen' remains fully supported and is selected automatically by
  # --modality cyclic_peptide, which RFD3 cannot build.
  backend: foundry

  foundry:
    # Machine-specific — set via the LPT_FOUNDRY_ROOT env var instead (see
    # .env.example and docs/environment_setup.md). This key is a same-machine
    # fallback only; leave it null so a fresh clone doesn't inherit someone
    # else's path.
    root: null
    # cwd MUST be `root` for `uv run` to resolve the venv. The Blackwell card is
    # sm_120, which the shipped container's torch is not built for — hence the
    # separate .venv-blackwell.
    launcher: ["uv", "run"]
    rfd3_bin: ".venv-blackwell/bin/rfd3"
    rf3_bin:  ".venv-blackwell/bin/rf3"
    mpnn_bin: ".venv-blackwell/bin/mpnn"
    ckpt:
      rfd3: "rfd3"            # checkpoint-registry aliases resolve to ~/pip_rcfoundry_ckpt
      rf3:  "rf3"
      mpnn: "solublempnn"
    # Exported as CUDA_VISIBLE_DEVICES by the generated run_campaign.sh.
    cuda_device: 0

    # Calibrated at ONE point (a ~175-token complex ran comfortably). RF3
    # attention is O(N^2) in tokens; re-measure by bisecting n_batches=2 runs at
    # increasing target size until OOM, then take 80% of the last passing value.
    target_residue_budget: 220
    # If a trim fails one of its own quality guards (a cut that opens
    # hydrophobic core, or loses too much interface) AND the target is within
    # this fraction over target_residue_budget, keep the target whole instead
    # of failing the campaign. Keeping it whole is strictly safer for the
    # design; it costs only GPU time, and RF3 scales as (tokens/195)**1.62.
    target_budget_overshoot: 0.15
    # RF3 output is ~2.5 MB per design directory, so disk — not GPU — is the
    # binding constraint: 48,000 refolds is ~120 GB.
    disk_budget_gb: 120
    min_free_gb: 20
    poll_interval_s: 120
    max_rfd3_attempts: 10
    max_rf3_attempts: 20

    rfd3:
      diffusion_batch_size: 4
      is_non_loopy: true
      infer_ori_strategy: hotspots
      inference_sampler:
        # IPD's documented PPI-designability settings. The reference CD79b
        # campaign used neither and returned 44 passing designs from 28,420.
        step_scale: 3
        gamma_0: 0.2

    prefilter:
      # Always runs — the geometric gates are not optional (of designs with
      # iPTM > 0.7, only 45%/8% on the two reference campaigns were docked on
      # target). There was an `enabled` key here that nothing read.
      # null => derive from the trim's segment count. A single-segment target
      # scores exactly 1 chainbreak; a two-segment trim scores 2, and a hardcoded
      # 1 would then reject every design.
      max_chainbreaks: null
      max_sidechain_clashes: 0
      max_backbone_clashes: 0
      min_non_loop: 0.6

    mpnn:
      n_seq: 4
      # The mpnn CLI buffers every result in RAM and flushes only after its last
      # input, so one config over 8000 designs shows an empty output dir until
      # the end and loses everything on a late crash.
      chunk_size: 250
      temperature: 0.1
      omit: "CYS"

    rf3:
      template: target
      # 1 is enough for screening; the engine default of 5 costs ~5x for a
      # marginally better best-of pick.
      diffusion_batch_size: 1
      seed: 0

    pilot:       {n_batches: 25}      # 100 designs — proves the spec runs
    calibration: {n_batches: 145}     # ~300 prefilter survivors x 4 seq
    production:  {n_batches: 3000}    # 12,000 designs

    # Hours threshold for the calibration stage's local-vs-cluster decision
    # (src/campaign_calibration.choose_compute): if the pessimistic single-GPU
    # estimate for the production run fits this many hours, production stays
    # on this workstation's GPU; otherwise a cluster package is staged
    # instead. Overridable per invocation via --max-local-hours.
    max_local_hours: 48

    # Wall-clock budget the CALIBRATION VERDICT is decided against
    # (src/campaign_calibration.calibrate -> _decide): a plan whose
    # Wilson-pessimistic cost exceeds max_campaign_days * 24 GPU-hours cannot
    # return SCALE_UP, and `adaptive_bar` will not raise the excellence bar to
    # a rung that does not fit it. Read by _stage_calibration with a hardcoded
    # default of 5 (= 120 GPU-h); declared here so the budget that decides
    # SCALE_UP vs SCALE_UP_PARTIAL is tunable without a code edit.
    max_campaign_days: 5

    # Delete the PAE matrices (`*_confidences.json`) of designs that did NOT
    # survive the hard gates, once scoring has finished. They are ~50% of an
    # RF3 output tree (405 KB of a typical 792 KB design directory) and disk —
    # not GPU — is the binding constraint on a production campaign.
    #
    # OFF by default because it is IRREVERSIBLE: ipSAE is computed from these
    # matrices and cannot be recomputed once they are gone, so re-gating an
    # existing campaign at a softer bar (exactly what an ITERATE verdict
    # recommends) would no longer be possible for the pruned designs. Turn it
    # on for long production campaigns where disk is tight. Survivors are
    # always kept, and pruning is skipped entirely when nothing survived.
    prune_confidences: false

  # Cluster compute path (src/cluster_runner.py): an ALTERNATIVE to the local
  # `foundry` GPU path above, for campaigns too big for one workstation. LPT
  # cannot reach the SLURM scheduler directly (no login-node access from this
  # machine), so this path only *prepares* a campaign — spec, trimmed
  # structure, target MSA, and a ready-to-run launch script staged onto shared
  # storage — then pauses with the exact command for a human to run on the
  # cluster. Resuming re-attaches and reads results back once they exist on
  # disk. Modelled directly on, and REUSES,
  # g-groups/.../binder_pipeline (RFD3 -> solubleMPNN ->
  # {RF3 | Protenix/IntelliFold2/...} refold, SLURM array jobs, apptainer
  # containers) rather than reimplementing it — that pipeline's own
  # `config/site.sh` is the actual source of truth for partition/account/
  # container paths; the keys below are only what LPT itself needs to decide
  # (which cluster, how many GPUs, which refold backend) plus enough of an
  # override surface that a future user pointed at a DIFFERENT cluster can
  # adapt this block without touching src/cluster_runner.py.
  cluster:
    enabled: false
    # Absolute path to a `binder_pipeline`-shaped checkout, reachable from
    # THIS machine for staging inputs (its bin/ scripts run on the cluster,
    # not here — this path is read/write, not executed). Machine-specific —
    # set via LPT_CLUSTER_PIPELINE_ROOT instead (see .env.example and
    # docs/environment_setup.md); left null here so a fresh clone doesn't
    # inherit someone else's path.
    pipeline_root: null
    # Where campaign inputs get staged, relative to pipeline_root: mirrors its
    # own examples/<name>/ convention so `bin/run_pipeline.sh` needs no
    # changes to find them.
    stage_subdir: "examples"
    # Free text shown verbatim in the pause instructions — this is the one
    # thing genuinely specific to "which human, which login node" and cannot
    # be inferred from the filesystem. Can also be set via
    # LPT_CLUSTER_SUBMIT_INSTRUCTIONS (a real multi-line .env value works —
    # see docs/environment_setup.md); the block below is a template, not a
    # real login node.
    submit_instructions: |
      ssh <cluster-login-node>
      cd <pipeline_root-as-seen-from-the-cluster>
    # Refold backend for the cluster path. "protenix" co-folds the target
    # de novo from sequence (no template support LPT's RF3 path relies on),
    # so `use_msa: true` is NOT optional — an unMSA'd target refolds ~11 A
    # wrong on CD79b (docs/refold_backends.md in pipeline_root), which lands
    # straight in binder_rmsd_bb. "rf3" is also valid here (identical spec,
    # same driver) if MSA fetching isn't set up yet.
    refold_backend: protenix
    use_msa: true
    # How the target MSA is fetched. "protenix_hosted" calls a SEPARATE,
    # machine-specific Protenix checkout's own hosted-MMseqs2 script (fast,
    # free, no local ColabFold DB) via subprocess — same pattern as the
    # PyRosetta/BoltzGen/foundry backends: a foreign venv, never imported.
    # Produces a standard .a3m the cluster pipeline's generic
    # `build_fold_yaml.py --target-msa` already accepts for ANY folding
    # backend, protenix included. "cluster_colabfold" instead defers to the
    # cluster's own bin/make_msa.sh (local ColabFold DB, blocking srun) —
    # use this if no local Protenix install exists; LPT then adds the two
    # extra manual commands to the pause instructions instead of running them.
    msa_source: protenix_hosted
    # Machine-specific — set via LPT_CLUSTER_PROTENIX_REPO instead (see
    # .env.example and docs/environment_setup.md).
    protenix_repo: null
    protenix_venv: ".venv"
    # GPUs available to a campaign at once. Maps to the cluster pipeline's
    # NARRAY (one array task = one GPU, stages 01/02); refold sharding
    # (SHARDS) is derived from this and n_batches so ~all GPUs stay busy.
    # Also the divisor `choose_compute()` uses to estimate cluster wall-clock
    # against `foundry.max_local_hours` — 8 is this group's current max
    # shared-node allocation; the gem_vegf_a campaign ran on 6 because that's
    # what was free that week, not a hard ceiling.
    n_gpus: 8
    # Same shape as design.foundry.{pilot,calibration,production} — reused
    # for sizing, not duplicated as separate math.
    pilot:       {n_batches: 25}
    calibration: {n_batches: 145}
    production:  {n_batches: 3000}
    diffusion_batch_size: 4
    n_seq: 4
    poll_hint_s: 1800   # how often campaign_status.py suggests re-checking

  # Scoring + ranking for the foundry backend (src/binder_metrics.py,
  # src/binder_ranking.py). Independent of the BoltzGen-oriented `thresholds`
  # and `ranking` blocks below.
  binder_metrics:
    ipsae_pae_cutoff: 10.0
    contact_cutoff: 8.0

  binder_ranking:
    thresholds:
      binder_rmsd_dock_max: 5.0     # the mis-dock gate; does the most work
      epitope_recall_min: 0.5
      # Fraction of the declared hotspots the binder must contact, so it scales
      # with however many were declared. Was 1.0 — every hotspot — which is a
      # bar the DESIGNS THEMSELVES often miss: on the 12-hotspot YAP1/TEAD1
      # calibration only 49% of RFD3 backbones contacted all 12, and 92.5% of
      # refolds engaged at least as many as their own design did. So 1.0 was
      # mostly rejecting refolds for missing residues the design never targeted.
      # Measured on that run, over the 1,392 refolds passing every other gate:
      #   12/12 -> 738 survivors, median iptm 0.847, dock 1.232
      #    9/12 -> 978 survivors, median iptm 0.842, dock 1.259
      # i.e. +33% yield for -0.005 iptm. The discarded 7-11 band had identical
      # pLDDT (0.798 vs 0.797) — well-folded, well-docked binders, not junk.
      hotspot_engagement_min: 0.75
      binder_rmsd_fold_max: 2.0
      binder_plddt_min: 0.75
      # ipsae_min is high-precision/low-recall: >0.5 is ~70% precise against the
      # Rosetta-validated set but recovers only ~4% of it. Kept OFF as a gate and
      # weighted heavily in the composite instead.
      ipsae_min_min: null
      iptm_min: 0.5
      iface_pae_max: 15.0
      require_no_clash: true
    weights:
      ipsae_min: 2.0
      neg_binder_rmsd_dock: 1.5
      binder_plddt: 1.5
      iptm: 1.0
      neg_iface_pae: 1.0
      epitope_recall: 1.0
      hotspot_engagement: 0.5
    mmr: {lambda_: 0.5, seq_identity_cap: 0.7}

    # PyRosetta interface metrics. Run ONLY on designs that already cleared the
    # confidence and geometry gates above, and folded only into the final
    # composite — never into the gate. Rosetta cannot tell a real complex from a
    # confidently wrong one: a mis-docked binder is still a physical pose, so
    # relax and InterfaceAnalyzer return well-defined numbers that mean nothing.
    # Gating first is also what makes it affordable (~10-30 s per design).
    rosetta:
      enabled: true
      max_designs: 300       # the tail is not worth the linear cost
      relax: true
      weights:               # merged over the weights above for the final rank
        neg_rosetta_ddg: 1.5
        rosetta_cms: 1.0
        neg_rosetta_vbuns: 0.5
    # The n_seq sequences sharing one RFD3 backbone are near-duplicates; without
    # this cap a top-20 comes from a handful of backbones.
    max_per_backbone: 1
    top_k: 20
    # How a production campaign is SIZED. Per 1000 RFD3 backbones, measured
    # across two complete campaigns:
    #     ipsae_min > 0.5 + gates    2.5 (8TAC)   0.1 (CD79b)
    #     iPTM      > 0.7 + gates   13.2 (8TAC)   2.0 (CD79b)
    # ipsae_min is a 5-20x rarer event, so a trial-sized sample cannot measure
    # it; iPTM is the practical sizing metric. ipsae_min is still computed on
    # every design and carries the heaviest weight in the ranking below.
    #
    # The gates are not optional: of designs with iPTM > 0.7, only 45% (8TAC)
    # and 8% (CD79b) are actually docked on target.
    success_metric: iptm       # iptm | ipsae_min
    target_designs: 50         # 100 when success_metric is ipsae_min
    excellence_bar: 0.7        # 0.5 when success_metric is ipsae_min
    # Kept for reference: the calibrated ipsae_min bar. The best ipsae_min ever
    # produced was 0.640 (8TAC) / 0.684 (CD79b) at the time this was written —
    # but KRAS/RAF1 later hit 0.931, so "unreachable" is target-dependent, not
    # a fact about ipsae_min itself. That is what adaptive_bar is for.
    excellence_ipsae_min: 0.5
    # On by default: before sizing at excellence_bar, walk the same bar ladder
    # suggested_bar is drawn from (strictest first) and raise to the strictest
    # rung that both has >= MIN_HITS_FOR_ESTIMATE hits and still fits the GPU
    # budget at its pessimistic bound. An unusually good target (e.g. KRAS/RAF1,
    # ipsae_min up to 0.93) gets sized to a correspondingly tighter bar instead
    # of the same fixed default every target gets; a marginal target falls
    # straight through to today's behaviour unchanged. Never lowers the bar.
    adaptive_bar: true

  # Domain-aware target truncation (src/structure_trim.py).
  trim:
    # Optional. Absent binaries degrade to RCSB annotations + the geometric
    # partition, logged loudly. Foldseek CANNOT parse domains — it is here for
    # the post-trim fold check and ranking diversity.
    chainsaw_cmd: null
    foldseek_bin: null
    min_bsa_retention: 0.90

  workstation:
    # Absolute path to the boltzgen entry point. The shebang on this script
    # carries its own venv's Python, so we can invoke it directly without
    # activating the env or going through `uv run`. Machine-specific — set
    # via LPT_BOLTZGEN_EXECUTABLE instead (see .env.example and
    # docs/environment_setup.md).
    boltzgen_executable: null
    cuda_device: 0
    timeout_hours: 24

  pilot:
    num_designs: 1000          # small first-pass batch
    budget: 30                 # final-set size for pilot
    min_completion_rate: 0.5   # fraction of num_designs that must finish the pipeline
    min_final_fill_rate: 0.5   # fraction of pilot budget that must survive filtering

  production:
    num_designs: 20000
    budget: 100

  # Stage 5 (analysis + ranking).
  # Hard filters — designs failing any of these are dropped before ranking.
  # Columns refer to entries on the enriched design records (boltzgen-native
  # or lpt_-prefixed; see src/design_metrics.py).
  thresholds:
    iptm_min: 0.60                  # design_to_target_iptm (higher = better)
    ipae_max: 10.0                  # min_design_to_target_pae (lower = better)
    hotspot_sasa_delta_min: 30.0    # lpt_hotspot_sasa_delta (Å² occluded; higher = better)
    require_boltzgen_pass: true     # require pass_filters == True from boltzgen's filter step

  ranking:
    # Only enrich the top-N by boltzgen's own quality_score with SASA before
    # filtering+ranking. At ~0.6s/design via the pyrosetta worker, 200 caps
    # the analysis stage at ~2 min even on full 20k production runs.
    enrich_top_k: 200
    # All weights act on z-scored survivors in "higher is better" form.
    # Columns must exist on the records (boltzgen-native or lpt_*).
    # Use neg_min_design_to_target_pae (boltzgen pre-inverts so higher = better).
    weights:
      design_to_target_iptm: 2.0
      neg_min_design_to_target_pae: 1.5
      lpt_hotspot_sasa_delta: 1.5
      complex_plddt: 1.0
    mmr:
      lambda_: 0.5                  # tradeoff: 1.0 = quality only, 0.0 = diversity only
      seq_identity_cap: 0.7         # designs ≥ this similar to a higher-ranked pick are dropped
    top_k: 20

  pyrosetta:
    # PyRosetta is OPTIONAL. It is used in exactly two places, both AFTER
    # designs already exist, and never to generate anything:
    #   * PPI track    — per-design hotspot SASA (burial of the target's
    #                    hotspot residues), in stage 5 analysis;
    #   * binder track — relax + InterfaceAnalyzer on designs that already
    #                    passed the geometric gates, in binder_scoring.
    # Both tracks run end-to-end without it; you lose those metrics and the
    # filters/weights that use them, nothing else.
    #
    #   auto  (default) use it when an interpreter is configured and present,
    #                   otherwise skip those steps with a warning, note the
    #                   skip in the stage report, and do NOT apply the
    #                   hotspot_sasa filter (rather than failing every design
    #                   for a metric that was never computed).
    #   true            require it — fail loudly at the point of use if it is
    #                   not configured. Use this for a reproducible campaign
    #                   where a silently different ranking rubric is worse
    #                   than a failed run.
    #   false           never use it, even if installed.
    #
    # NOTE: PyRosetta is free for academic / non-commercial use only.
    # Commercial use needs a licence — see docs/pyrosetta_setup.md.
    enabled: auto

    # PyRosetta runs in its own conda env (Python 3.11) because the
    # installed pyrosetta build is ABI-incompatible with the LPT venv's
    # Python. src/pyrosetta_sasa.py subprocesses scripts/_sasa_worker.py
    # under this interpreter; results come back as JSON on stdout.
    # Machine-specific — set via LPT_PYROSETTA_PYTHON instead (see
    # .env.example and docs/environment_setup.md).
    python_executable: null
    init_flags: "-mute all -ignore_unrecognized_res -load_PDB_components false"

  # Hard ground rules for what the pipeline will design against. The
  # structure stage surfaces per-chain residue counts to the LLM in the
  # structure_query so it can pick a chain within bounds (or recommend
  # cropping). The binder size ranges below are baked into the BoltzGen
  # YAML's `sequence: <min>..<max>` slot at the protein-design-script step.
  constraints:
    # BoltzGen + structure prediction scale with target residue count.
    # Above max_target_residues the design pass rate drops and GPU memory
    # pressure increases. Smaller is generally better.
    max_target_residues: 500     # hard upper limit — flag any chain above
    target_residues_warn: 250    # softer threshold — note in query as suboptimal
    binder_sizes:
      cyclic_peptide:
        min: 12
        max: 15
      mini_protein:
        min: 70
        max: 86
