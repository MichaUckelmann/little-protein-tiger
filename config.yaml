# ---------------------------------------------------------------------------
# Quality scoring
# ---------------------------------------------------------------------------
quality:
  # Extra journals to add to tier 1 (score 1.0) beyond the built-in list.
  # Use the journal name exactly as it appears in NCBI (usually abbreviated).
  tier1_extra: []

  # Extra journals to add to tier 2 (score 0.7).
  tier2_extra: []

  # Papers with these NCBI pub types are excluded from downloads entirely.
  # Conference abstracts have PMCIDs but no individual files on AWS.
  exclude_pub_types:
    - "Congress"
    - "Meeting Abstract"

  # Minimum priority_score to attempt download (0.0 = download everything).
  min_score_to_download: 0.0

  # Restrict downloads to papers from journals in the tier 1/2 list only
  # (src/ranking.py). Search still INDEXES every hit, so widening this later
  # and re-running fetch_papers.py needs no re-search.
  #
  # On the shipped corpus this gate passes 32% of indexed papers; turning it
  # off multiplies downloads ~3.1x, with matching curation cost and disk.
  # See docs/journal-filtering.md for the tier lists, what is excluded, and
  # how to extend them (tier1_extra / tier2_extra above).
  require_tiered_journal: true

  # Only download papers whose licence AFFIRMATIVELY permits derivative works.
  # Curating a paper produces a fingerprint, which is derived from its content,
  # so a No-Derivatives term (`cc by-nc-nd`, `cc by-nd`) — or NO recorded
  # licence, which is the absence of permission rather than permission — makes
  # that fingerprint one you may not redistribute.
  #
  # Measured on the reference corpus: of 14,517 curated papers only 7,327
  # (50.5%) permit derivatives, 1,506 (10.4%) carry an ND term and 5,684
  # (39.2%) record no licence at all. So this gate roughly halves what a fresh
  # corpus build downloads — which is the cost of being able to publish it.
  #
  # Licences are resolved from Europe PMC at download time and cached in
  # `papers.licence`. `--allow-restricted-licence` turns the gate off for a
  # corpus you will only ever use locally; `scripts/package_corpus.py` still
  # refuses to put those fingerprints in a release archive unless you also pass
  # `--no-licence-filter`. See docs/licensing.md.
  require_derivative_licence: true

# ---------------------------------------------------------------------------
# Search keywords
# ---------------------------------------------------------------------------
keywords:
  # Gap: developmental biology
  - "histone chaperone[Title/Abstract] AND mechanism[Title/Abstract]"
  - "histone chaperone[Title/Abstract] AND structure[Title/Abstract]"
  - "histone chaperone[Title/Abstract] AND biochemistry[Title/Abstract]"
  - "H2A[Title/Abstract] AND H2B[Title/Abstract] AND chaperone[Title/Abstract]"
  - "FACT[Title/Abstract] AND H2A[Title/Abstract] AND H2B[Title/Abstract]"
  - "histone chaperones[Title/Abstract] AND epigenetics[Title/Abstract]"
  - "NAP1[Title/Abstract] AND H2A[Title/Abstract] AND H2B[Title/Abstract]"
  - "NAP1[Title/Abstract] AND chaperone[Title/Abstract]"
  - "H2A[Title/Abstract] AND chaperone[Title/Abstract]"
  - "histone chaperone[Title/Abstract] AND molecular mechanism[Title/Abstract]"
  - "H2A[Title/Abstract] AND chaperone[Title/Abstract] AND molecular mechanism[Title/Abstract]"
  - "FACT[Title/Abstract] AND histone[Title/Abstract]"
  - "NAP1[Title/Abstract] AND histone[Title/Abstract]"
  - "FACT[Title/Abstract] AND structure[Title/Abstract] AND histone[Title/Abstract]"
  - "H2A[Title/Abstract] AND chaperone[Title/Abstract] AND structure[Title/Abstract]"
  - "H2B[Title/Abstract] AND chaperone[Title/Abstract]"

  


 
search:
  max_results_per_query: 200
  # NCBI eSearch covers PMC full-text articles (including those indexed as
  # MEDLINE in Europe PMC that HAS_FT:Y / SRC:PMC would miss)
  ncbi_pmc: true
  # Europe PMC covers preprints (bioRxiv / medRxiv)
  europepmc_sources: ["ppr"]
  # Semantic Scholar: discovers OA papers outside PMC and provides citation counts
  # for ranking.  Requires S2_API_KEY env var for best rate limits.
  semantic_scholar: true

paths:
  pdf_dir: "data/pdfs"
  db_path: "data/literature.db"
  fingerprint_dir: "data/fingerprints"
  structures_dir: "data/structures"
  # DepMap's CRISPR gene-effect matrix. Blank = data/depmap/CRISPRGeneEffect.csv.
  # It is a 420 MB HAND download (DepMap's portal 403s a scripted GET), so in a
  # lab it is usually one shared copy — point at it rather than duplicating it
  # per checkout. `LPT_DEPMAP_CSV` in .env overrides this; see
  # docs/environment_setup.md. Relative paths resolve against the repo root and
  # `~` is expanded. Only find_cocorrelated_genes, get_genetic_codependency and
  # export_subgraph(with_depmap=True) read it; without it they return an error
  # and the run continues.
  depmap_csv: ""

# ── Model selection + pricing ────────────────────────────────────────────────
# Single source of truth for which model each pipeline stage uses and what it
# costs.  src/pipeline_runner.py falls back to its own _DEFAULT_* tables when a
# key is absent here, so this block is optional but authoritative.
#
# NOTE: extended thinking on these models is ADAPTIVE — `budget_tokens` was
# removed on claude-sonnet-5 / claude-opus-5 and is rejected with a 400.
models:
  # Default provider for every pipeline stage (PipelineRunner's `provider`
  # constructor default and --provider CLI default) is now "gemini" —
  # gemini-3.7-flash below. Not just cost (~4x cheaper input than Sonnet):
  # this run's own live evidence is claude-sonnet-5 refusing (category
  # "bio") on BOTH the target_intel and interface stages for a routine
  # antagonist-design query, each refusal burning real spend (one cost
  # $1.10 for nothing). Gemini answered the same prompts cleanly every
  # time, so starting there skips paying for that failure.
  # `--provider claude` still selects the Claude path in full.
  #
  # THERE ARE NO `refusal_fallbacks` ANY MORE — the key is gone from every
  # provider below, and nothing reads it. A safety classifier declining a
  # stage ENDS THE RUN. Selecting a different model is a decision for the
  # operator to take after reading the refusal, not something the pipeline
  # does on its own:
  #
  #   --provider <claude|gemini|openai>       whole run
  #   models.<provider>.stages.<stage>        one stage (see `stages:` below)
  #   --start-from <stage>                    resume where it stopped
  #
  # Why it was removed, in one line: any automatic retry is the pipeline
  # going looking for a model that will produce content the operator's
  # chosen model declined to produce, and nobody reading the output can
  # tell that apart from a legitimate workaround for a miscalibrated
  # classifier. These refusals often ARE miscalibrated for structural
  # biology — which is why the judgement belongs to a person who can say
  # why a target is legitimate, and not to a `for` loop that cannot.
  # See docs/responsible-use.md.
  claude:
    default: "claude-sonnet-5"
    # Haiku cannot do extended thinking; stages requesting it upgrade to this.
    thinking_upgrade: "claude-sonnet-5"
    # Historical note, kept because it is the evidence behind the policy
    # above: refusals are strongly model-dependent. On the
    # complex-structure-analysis prompt claude-sonnet-5 refuses with category
    # "bio", and across three separate interface-stage refusals on one target
    # (PD-L1) claude-opus-5 ALSO refused every time, same category, ~$0.13
    # spent for nothing each time. Anthropic's classifiers are consistent
    # across the Claude family for a given category, so if you are choosing a
    # replacement model by hand, another Claude is the least likely to help.
    # Per-stage model overrides. This is the ONLY way a stage gets a model
    # other than `default` above, and it is a deliberate, recorded choice in a
    # config file — which is the point. An entry may name another PROVIDER as
    # "provider:model" (a bare id is routed by its own prefix, so
    # `claude-opus-5` under models.gemini.stages reaches Anthropic, not a 404).
    #
    # SHIPPED EMPTY, on purpose. `summary` and `binder_summary` used to be
    # pinned here to claude-haiku-4-5, because Sonnet-class models decline the
    # "review of designed binders" task and Haiku answers it. That is a smaller
    # model producing content a larger one refused — the same thing the deleted
    # fallback chain did, pre-declared rather than reached at runtime — so it
    # went with the chain.
    #
    # CONSEQUENCE, and it is real: under `--provider claude` those two stages
    # now run on claude-sonnet-5 and may be REFUSED, which ends the run at the
    # final summary (the designs and scores are already on disk; the write-up
    # is what you lose). The default provider answers them cleanly. If you hit
    # it and judge the work legitimate, that is exactly the decision this key
    # is for:
    #
    #   stages:
    #     binder_summary: "gemini:gemini-3.7-flash"
    #
    # The binder track's `interface` stage is the other known refusal: declined
    # by claude-sonnet-5 and often by claude-opus-5 with category "bio". Do not
    # reach for claude-haiku-4-5 there — it answers, but cannot reliably
    # produce the MODEL-READY HOTSPOTS table the next stage parses. Gemini
    # answers and is ~4x cheaper on input.
    stages: {}
  gemini:
    default: "gemini-3.7-flash"
    # gemini-3.7-flash can decline too (`_run_gemini` raises
    # SkillRefusedError for an empty-candidates response, a
    # promptFeedback.blockReason, or a SAFETY-class per-candidate
    # finishReason). When it does, the run stops — see the note at the top of
    # this block. `--provider claude` is a reasonable thing to try NEXT, as a
    # decision you take having read the refusal.

  openai:
    # Responses API (`/v1/responses`), reached with `requests` like gemini —
    # no vendor SDK. "terra" is the general model; "luna" is the sibling and
    # is selectable per stage or with --model-id.
    default: "gpt-5.6-terra"

  # USD per 1M tokens.  Cache multipliers apply to the INPUT rate:
  # cache writes bill at ~1.25x (5-minute TTL; use 2.0 for a 1h TTL) and cache
  # reads at ~0.10x.  The API reports uncached input, cache-write and cache-read
  # as separate buckets, so they are priced separately — never summed.
  pricing:
    claude-opus-5:      {input: 5.00,  output: 25.00}
    claude-sonnet-5:    {input: 3.00,  output: 15.00}   # $2/$10 intro rate through 2026-08-31
    claude-haiku-4-5:   {input: 1.00,  output: 5.00}
    claude-fable-5:     {input: 10.00, output: 50.00}
    gemini-3.7-flash:              {input: 0.75, output: 3.75}   # intro rate; DOUBLES to 1.50/7.50 in January 2027
    # Same per-token rate as 3.7 (confirmed on the account, 2026-09-10),
    # so a switch is decided on TOKENS SPENT and output quality, not on
    # price — which is what `scripts/bench_models.py` measures. It needs
    # its own entry regardless: `rates_for` prefix-matches, and
    # "gemini-3.8-flash" does not start with "gemini-3.7-flash", so
    # without this line every 3.8 call prices at $0.00 and a --budget cap
    # silently stops enforcing.
    gemini-3.8-flash:              {input: 0.75, output: 3.75}   # intro rate; DOUBLES with 3.7's in January 2027
    gemini-3.1-flash-lite:         {input: 0.25, output: 1.50}
    # Retired name, kept so ledger lines written before the GA rename
    # still price rather than logging as unpriced.
    gemini-3.1-flash-lite-preview: {input: 0.25, output: 1.50}
    # ── OpenAI ────────────────────────────────────────────────────────────
    # terra is the account's real rate, confirmed 2026-09-10. luna is still a
    # PLACEHOLDER — not a guess at the real price, but a value that lets
    # `rates_for()` resolve so a --budget cap is ENFORCED rather than silently
    # bypassed (an unpriced model prices at $0.00, so a cap never fires — see
    # token_budget.price). `budget_requires_pricing` in the design block below
    # turns that bypass into a hard error instead. Check luna against your own
    # account before trusting a cap on it.
    #
    # Note terra is ~2.7x gemini-3.7-flash on input and ~3.2x on output, so an
    # --provider openai run costs several times what the same run costs on the
    # default provider. Nothing in the pipeline changes; the bill does.
    gpt-5.6-terra:      {input: 2.00, output: 12.00}   # real, 2026-09-10
    gpt-5.6-luna:       {input: 1.25, output: 10.00}   # PLACEHOLDER

curation:
  # gemini, like every other LLM stage in this repo. It was "claude" long
  # after the pipeline-wide default moved, which meant the onboarding docs
  # ("Gemini is the default provider") and the code disagreed, and a user
  # with only a Gemini key had every paper in a batch fail on the same
  # missing ANTHROPIC_API_KEY.
  provider: "gemini"            # "claude" | "gemini" | "local". Override per-run with --provider.
  model: "claude-haiku-4-5"    # options: "claude-haiku-4-5" and "claude-sonnet-5"
  # flash-lite over flash: curation is high-volume and schema-constrained
  # (strict JSON against extraction_schema.json, with a validator that feeds
  # errors back as a correction turn), which is the shape of work the smaller
  # model handles at ~1/8 the cost.
  gemini_model: "gemini-3.1-flash-lite"
  # alternatives: "gemini-3.7-flash" (stronger, ~8x the cost), "gemini-3-flash-preview"

  # ── Local provider ────────────────────────────────────────────────────────
  # Default points at Ollama's OpenAI-compatible endpoint.
  # For vLLM/SGLang, switch local_endpoint to http://localhost:8000/v1 and set
  # local_model to the HF id (e.g. "Qwen/Qwen3.5-9B").
  local_model: "gemma4:26b-a4b-it-q4_K_M"
  local_endpoint: "http://localhost:11434/v1"
  # Sampling knobs merged into the request body. Low temperature for strict
  # structured extraction; response_format pins Ollama into JSON-only mode.
  # reasoning_effort=none disables Gemma 4's thinking mode — without it the
  # model dumps everything into a `reasoning` field and `content` stays empty
  # until reasoning ends, blowing through max_tokens before producing output.
  local_sampling:
    temperature: 0.1
    top_p: 0.95
    reasoning_effort: "none"
    response_format: {type: "json_object"}
  # Ollama-specific nested options. num_ctx must be large enough to hold
  # system prompt (~5k tok) + max_input_chars/4 input tok + max_tokens output.
  # At 150 000 chars input this is ~50k tokens total → 65 536 ctx is safe.
  local_options:
    num_ctx: 65536
  local_request_timeout: 900    # seconds; local generation is slower than cloud

  max_tokens: 8000
  max_input_chars: 150000       # raised from 90 000 — fits in num_ctx 65 536
  delay_s: 1.0
  max_retries: 3
  prompt_path: "curation_prompt.md"
  schema_path: "extraction_schema.json"

rate_limits:
  europepmc_delay_s: 0.5
  ncbi_delay_s: 0.34        # ~3 req/s without API key; auto-speeds to 0.1 with NCBI_API_KEY
  s2_delay_s: 1.1           # ~1 req/s without S2_API_KEY; auto-reduces to 0.2 with key
  download_delay_s: 1.0
  max_retries: 3

vector_store:
  db_path: "data/vectors"
  embedding_model: "NeuML/pubmedbert-base-embeddings"
  top_k_default: 5

# ---------------------------------------------------------------------------
# Design execution (workstation, stages 4-6)
# ---------------------------------------------------------------------------
# Stage 4 (execution) is deterministic: src/design_runner.py wraps
# `boltzgen check` + `boltzgen run` as a blocking subprocess on this machine.
# Pilot then production, using BoltzGen's --reuse flag so production extends
# the pilot output in place (no double-billing of GPU time).
design:
  # Stage 0 (pathway) skill selection. "standard" = pathway-expert (default,
  # validated-target-biased); "wildcard" = wildcard-expert (graph-driven
  # novelty triage, prefers HYPOTHESIS/SYNTHETIC_LETHALITY/CROSS_INDICATION_TRANSFER
  # tiers when tractable). CLI --pathway-mode overrides this value when set.
  pathway:
    mode: standard

  # "foundry" (the default) or "boltzgen" — the two live engines; both run
  # the binder-track stage machine on every workflow, so this key is no
  # longer --workflow ppi only. ("boltzgen_legacy", the src/design_runner.py
  # path, was retired 2026-09-13 and is refused here as at the CLI.)
  # (foundry hands off to the same RFD3 -> solubleMPNN -> RF3 stage machine
  # --workflow binder uses, right after PPI's own structure stage — see
  # PipelineRunner._bridge_ppi_to_binder_track and
  # UNIFY_DESIGN_BACKEND_NOTES.md).
  # DEFAULT since the bridge was validated on a real KRAS/RAF1 GPU campaign:
  # both --workflow ppi and --workflow binder now run the same RFD3 ->
  # solubleMPNN -> RF3 machine, so a target discovered by the PPI stages is
  # designed the same way as one named directly. CLI --design-engine overrides
  # this; foundry requires --project.
  #
  # 'boltzgen' remains fully supported and is selected automatically by
  # --modality cyclic_peptide, which RFD3 cannot build.
  backend: foundry

  foundry:
    # Machine-specific — set via the LPT_FOUNDRY_ROOT env var instead (see
    # .env.example and docs/environment_setup.md). This key is a same-machine
    # fallback only; leave it null so a fresh clone doesn't inherit someone
    # else's path.
    root: null
    # Where foundry's checkpoint registry lives. Machine-specific like `root`
    # — set LPT_FOUNDRY_CKPT_DIR instead. null falls back to foundry's own
    # default, ~/pip_rcfoundry_ckpt.
    ckpt_dir: null
    # cwd MUST be `root` for `uv run` to resolve the venv. The Blackwell card is
    # sm_120, which the shipped container's torch is not built for — hence the
    # separate .venv-blackwell.
    launcher: ["uv", "run"]
    rfd3_bin: ".venv-blackwell/bin/rfd3"
    rf3_bin:  ".venv-blackwell/bin/rf3"
    mpnn_bin: ".venv-blackwell/bin/mpnn"
    ckpt:
      rfd3: "rfd3"            # checkpoint-registry aliases resolve to ~/pip_rcfoundry_ckpt
      rf3:  "rf3"
      mpnn: "solublempnn"
    # Exported as CUDA_VISIBLE_DEVICES by the generated run_campaign.sh.
    cuda_device: 0

    # MEASURED 2026-09-14 on this card (RTX PRO 4500 Blackwell, 32.6 GB,
    # otherwise idle but for a 2.0 GB desktop). The bisection this comment used
    # to ask for has been run, for BOTH gpu stages, and the numbers are in
    # `docs/` + TARGET_SELECTION_AUDIT.md:
    #
    #   RF3, one refold      195 tok  4.1 GB net ... 698 tok 30.0 GB net (fits,
    #                        0.59 GB spare); 848 tok -> CUDA OOM.
    #   RFD3, batch 4        589 tok 25.4 GB peak (7.2 GB spare);
    #                        665 tok 32.0 GB peak (0.58 GB spare).
    #
    # Both are quadratic above ~400 tokens (RF3 net ~= 385 + 0.0588*tok^2 MiB;
    # RFD3 ~= 0.0675*tok^2), so margin collapses fast and RFD3 — not RF3 — is
    # the binding stage, because it holds one diffusion trajectory per batch
    # member. 500 target residues is 586-590 tokens with a 86-90mer binder,
    # which measured 25.4 GB: 22% of the card free. That is the operating
    # point this number now encodes, and it is a measurement rather than the
    # single ~175-token data point 220 was set from.
    #
    # `max_complex_tokens` below is what actually keeps a campaign off the
    # cliff; raising this without raising that will simply be refused at
    # spec-build time rather than dying on the GPU hours later.
    target_residue_budget: 500
    # The TOKEN ceiling, which is the one the GPU cares about: the residue
    # budget above counts the target only and never the binder, so it is ~28%
    # short of the real complex. 600 keeps ~19% of the card free at the
    # measured quadratic; 665 tokens ran with 1.8% free, which is not headroom
    # — one browser tab turns it into an OOM mid-campaign. Raise it if your
    # card is bigger, and re-measure rather than extrapolating: the exponent
    # steepens with size.
    max_complex_tokens: 600
    # If a trim fails one of its own quality guards (a cut that opens
    # hydrophobic core, or loses too much interface) AND the target is within
    # this fraction over target_residue_budget, keep the target whole instead
    # of failing the campaign. Keeping it whole is strictly safer for the
    # design; it costs only GPU time, and RF3 scales as (tokens/195)**1.62.
    # NOTE this multiplies the budget: at 500 it would permit 575 residues =
    # 665 tokens, which measured 32.0 of 32.6 GB. `max_complex_tokens` is what
    # stops that, so the overshoot now yields ~514 residues in practice.
    target_budget_overshoot: 0.15
    # RF3 output is ~2.5 MB per design directory, so disk — not GPU — is the
    # binding constraint. This is a CAP, not an estimate: 48,000 refolds is
    # ~47 GB at the 195-token anchor and ~88 GB against a 220-residue target,
    # per `foundry_runner.refold_bytes`. Free space still binds first.
    disk_budget_gb: 120
    min_free_gb: 20
    poll_interval_s: 120
    max_rfd3_attempts: 10
    max_rf3_attempts: 20

    rfd3:
      diffusion_batch_size: 4
      is_non_loopy: true
      infer_ori_strategy: hotspots
      inference_sampler:
        # IPD's documented PPI-designability settings. The reference CD79b
        # campaign used neither and returned 44 passing designs from 28,420.
        step_scale: 3
        gamma_0: 0.2

    prefilter:
      # Always runs — the geometric gates are not optional (of designs with
      # iPTM > 0.7, only 45%/8% on the two reference campaigns were docked on
      # target). There was an `enabled` key here that nothing read.
      # null => derive from the trim's segment count. A single-segment target
      # scores exactly 1 chainbreak; a two-segment trim scores 2, and a hardcoded
      # 1 would then reject every design.
      max_chainbreaks: null
      max_sidechain_clashes: 0
      max_backbone_clashes: 0
      min_non_loop: 0.6

    mpnn:
      n_seq: 4
      # The mpnn CLI buffers every result in RAM and flushes only after its last
      # input, so one config over 8000 designs shows an empty output dir until
      # the end and loses everything on a late crash.
      chunk_size: 250
      temperature: 0.1
      omit: "CYS"

    rf3:
      template: target
      # 1 is enough for screening; the engine default of 5 costs ~5x for a
      # marginally better best-of pick.
      diffusion_batch_size: 1
      seed: 0

    pilot:       {n_batches: 25}      # 100 designs — proves the spec runs
    calibration: {n_batches: 145}     # ~300 prefilter survivors x 4 seq
    production:  {n_batches: 3000}    # 12,000 designs

    # Hours threshold for the calibration stage's local-vs-cluster decision
    # (src/campaign_calibration.choose_compute): if the pessimistic single-GPU
    # estimate for the production run fits this many hours, production stays
    # on this workstation's GPU; otherwise a cluster package is staged
    # instead. Overridable per invocation via --max-local-hours.
    max_local_hours: 48

    # Wall-clock budget the CALIBRATION VERDICT is decided against
    # (src/campaign_calibration.calibrate -> _decide): a plan whose
    # Wilson-pessimistic cost exceeds max_campaign_days * 24 GPU-hours cannot
    # return SCALE_UP, and `adaptive_bar` will not raise the excellence bar to
    # a rung that does not fit it. Read by _stage_calibration with a hardcoded
    # default of 5 (= 120 GPU-h); declared here so the budget that decides
    # SCALE_UP vs SCALE_UP_PARTIAL is tunable without a code edit.
    max_campaign_days: 5

    # Delete the PAE matrices (`*_confidences.json`) of designs that did NOT
    # survive the hard gates, once scoring has finished. They are ~50% of an
    # RF3 output tree (405 KB of a typical 792 KB design directory) and disk —
    # not GPU — is the binding constraint on a production campaign.
    #
    # OFF by default because it is IRREVERSIBLE: ipSAE is computed from these
    # matrices and cannot be recomputed once they are gone, so re-gating an
    # existing campaign at a softer bar (exactly what an ITERATE verdict
    # recommends) would no longer be possible for the pruned designs. Turn it
    # on for long production campaigns where disk is tight. Survivors are
    # always kept, and pruning is skipped entirely when nothing survived.
    prune_confidences: false

  # Cluster compute path (src/cluster_runner.py): an ALTERNATIVE to the local
  # `foundry` GPU path above, for campaigns too big for one workstation. LPT
  # cannot reach the SLURM scheduler directly (no login-node access from this
  # machine), so this path only *prepares* a campaign — spec, trimmed
  # structure, target MSA, and a ready-to-run launch script staged onto shared
  # storage — then pauses with the exact command for a human to run on the
  # cluster. Resuming re-attaches and reads results back once they exist on
  # disk. Modelled directly on, and REUSES,
  # g-groups/.../binder_pipeline (RFD3 -> solubleMPNN ->
  # {RF3 | Protenix/IntelliFold2/...} refold, SLURM array jobs, apptainer
  # containers) rather than reimplementing it — that pipeline's own
  # `config/site.sh` is the actual source of truth for partition/account/
  # container paths; the keys below are only what LPT itself needs to decide
  # (which cluster, how many GPUs, which refold backend) plus enough of an
  # override surface that a future user pointed at a DIFFERENT cluster can
  # adapt this block without touching src/cluster_runner.py.
  cluster:
    enabled: false
    # Absolute path to a `binder_pipeline`-shaped checkout, reachable from
    # THIS machine for staging inputs (its bin/ scripts run on the cluster,
    # not here — this path is read/write, not executed). Machine-specific —
    # set via LPT_CLUSTER_PIPELINE_ROOT instead (see .env.example and
    # docs/environment_setup.md); left null here so a fresh clone doesn't
    # inherit someone else's path.
    pipeline_root: null
    # Where campaign inputs get staged, relative to pipeline_root: mirrors its
    # own examples/<name>/ convention so `bin/run_pipeline.sh` needs no
    # changes to find them.
    stage_subdir: "examples"
    # Free text shown verbatim in the pause instructions — this is the one
    # thing genuinely specific to "which human, which login node" and cannot
    # be inferred from the filesystem. Can also be set via
    # LPT_CLUSTER_SUBMIT_INSTRUCTIONS (a real multi-line .env value works —
    # see docs/environment_setup.md); the block below is a template, not a
    # real login node.
    submit_instructions: |
      ssh <cluster-login-node>
      cd <pipeline_root-as-seen-from-the-cluster>
    # Refold backend for the cluster path. "protenix" co-folds the target
    # de novo from sequence (no template support LPT's RF3 path relies on),
    # so `use_msa: true` is NOT optional — an unMSA'd target refolds ~11 A
    # wrong on CD79b (docs/refold_backends.md in pipeline_root), which lands
    # straight in binder_rmsd_bb. "rf3" is also valid here (identical spec,
    # same driver) if MSA fetching isn't set up yet.
    refold_backend: protenix
    use_msa: true
    # How the target MSA is fetched. "protenix_hosted" calls a SEPARATE,
    # machine-specific Protenix checkout's own hosted-MMseqs2 script (fast,
    # free, no local ColabFold DB) via subprocess — same pattern as the
    # PyRosetta/BoltzGen/foundry backends: a foreign venv, never imported.
    # Produces a standard .a3m the cluster pipeline's generic
    # `build_fold_yaml.py --target-msa` already accepts for ANY folding
    # backend, protenix included. "cluster_colabfold" instead defers to the
    # cluster's own bin/make_msa.sh (local ColabFold DB, blocking srun) —
    # use this if no local Protenix install exists; LPT then adds the two
    # extra manual commands to the pause instructions instead of running them.
    msa_source: protenix_hosted
    # Machine-specific — set via LPT_CLUSTER_PROTENIX_REPO instead (see
    # .env.example and docs/environment_setup.md).
    protenix_repo: null
    protenix_venv: ".venv"
    # GPUs available to a campaign at once. Maps to the cluster pipeline's
    # NARRAY (one array task = one GPU, stages 01/02); refold sharding
    # (SHARDS) is derived from this and n_batches so ~all GPUs stay busy.
    # Also the divisor `choose_compute()` uses to estimate cluster wall-clock
    # against `foundry.max_local_hours` — 8 is this group's current max
    # shared-node allocation; the gem_vegf_a campaign ran on 6 because that's
    # what was free that week, not a hard ceiling.
    n_gpus: 8
    # Same shape as design.foundry.{pilot,calibration,production} — reused
    # for sizing, not duplicated as separate math.
    pilot:       {n_batches: 25}
    calibration: {n_batches: 145}
    production:  {n_batches: 3000}
    diffusion_batch_size: 4
    n_seq: 4
    poll_hint_s: 1800   # how often campaign_status.py suggests re-checking

  # Modal compute path (src/modal_runner.py + src/modal_app.py): LPT spawns
  # RFD3 -> solubleMPNN -> RF3 on Modal's GPUs, polls a progress file, and
  # syncs the finished tree back into the ordinary local campaign directory —
  # so everything downstream (scoring, ranking, reports, --start-from
  # binder_scoring) reads it exactly as it reads a local run.
  #
  # THE ONLY BILLED COMPUTE TARGET IN LPT. Reaching it always takes an
  # explicit `--compute modal`: `choose_compute` cannot return it, so `auto`
  # never drifts here, and a resume that finds a persisted modal placement
  # without `--compute modal` on the command line is REFUSED rather than
  # either continuing to spend or silently falling back to a multi-day local
  # run. Nothing below turns it on; these are only the terms it runs under
  # once an operator asks for it.
  #
  # One-time setup:  modal setup && python scripts/modal_setup.py
  # (the second uploads solubleMPNN, which foundry's own `install base-models`
  #  does not ship, and deploys one function per GPU).
  modal:
    # Which GPU. Each is a SEPARATELY DEPLOYED Modal function, because a
    # Function's resources are fixed at deploy time in this client — so
    # changing this needs `modal deploy src/modal_app.py` again.
    #
    # A10 is the default and is not the weak choice it looks like. Measured on
    # a 286-token complex (projects/smoke_foundry's TEAD1 spec): RF3 refolds at
    # ~17 s against this workstation's fitted 17.8 s — at par — while RFD3 runs
    # 17.3 s/design against 10.0 s, i.e. 1.7x slower. RF3 is the bulk of a
    # campaign, so A10 is both the cheapest and the best value here. Options:
    # A10 | L40S | A100-40GB | H100.
    gpu: "A10"
    # Hard ceiling in USD on ONE stage launch, checked before any GPU-second is
    # spent; over it, the launch is refused, not warned about. A warning in a
    # detached campaign is a log line nobody reads until the invoice arrives.
    # 10.0 comfortably covers a pilot (~$2) and a calibration (~$10 at 286
    # tokens) and refuses a production campaign, which at these rates is
    # several hundred dollars and should be a deliberate, separate decision.
    max_usd: 10.0
    # Modal-GPU seconds per local-GPU second for the same work. Blended across
    # the two stages that matter (see `gpu` above): the true figures on A10 are
    # ~0.96x for RF3 and ~1.72x for RFD3, so a campaign lands near 1.1x. The
    # default rounds UP because over-costing only refuses a run while
    # under-costing spends money.
    speed_factor: 1.25
    # How many containers to split one stage across. 1 = no fan-out.
    #
    # Parallelism here is FREE IN MONEY and only in money: Modal bills
    # GPU-seconds, so 20 containers for 1 h costs exactly what 1 container for
    # 20 h costs. What it buys is wall-clock — a campaign that is GPU-days on
    # one card finishes in hours — and what it costs is duplicated model
    # loading, ~90 s per container (RFD3's 2.7 GB plus RF3's 3.0 GB, measured
    # on A10). That is why `min_shard_minutes` exists rather than a bare
    # container count: LPT clamps the shard count down rather than cutting
    # shards so small that reloading the checkpoints dominates their bill.
    #
    # Each shard gets its own subdirectory on the volume AND its own spec
    # filename, because RFD3 restarts its batch counter at 0 per shard and
    # would otherwise write colliding names for genuinely different designs
    # (RFD3 inference is unseeded — two containers given the same spec
    # produced 73- and 78-residue binders).
    n_containers: 1
    # Refuse to cut a shard below this much work; the shard count is reduced
    # to fit. 20 min keeps the ~90 s reload under ~8% of a shard's cost.
    min_shard_minutes: 20
    # Seconds between progress polls. Each poll reads one small progress.json
    # off the volume — an API call, not a container start, so this is cheap;
    # the run itself writes that file every 30 s from inside.
    poll_interval_s: 60
    # Skip downloading *_confidences.json (the PAE matrices) on sync-back.
    # They are roughly half the bytes AND the only source for ipSAE, which
    # cannot be recomputed once they are gone — same trade as
    # design.foundry.prune_confidences, and off for the same reason.
    skip_confidences: false

  # Scoring + ranking for the foundry backend (src/binder_metrics.py,
  # src/binder_ranking.py). Independent of the BoltzGen-oriented `thresholds`
  # and `ranking` blocks below.
  binder_metrics:
    ipsae_pae_cutoff: 10.0
    contact_cutoff: 8.0

  binder_ranking:
    thresholds:
      binder_rmsd_dock_max: 5.0     # the mis-dock gate; does the most work
      epitope_recall_min: 0.5
      # Fraction of the declared hotspots the binder must contact, so it scales
      # with however many were declared. Was 1.0 — every hotspot — which is a
      # bar the DESIGNS THEMSELVES often miss: on the 12-hotspot YAP1/TEAD1
      # calibration only 49% of RFD3 backbones contacted all 12, and 92.5% of
      # refolds engaged at least as many as their own design did. So 1.0 was
      # mostly rejecting refolds for missing residues the design never targeted.
      # Measured on that run, over the 1,392 refolds passing every other gate:
      #   12/12 -> 738 survivors, median iptm 0.847, dock 1.232
      #    9/12 -> 978 survivors, median iptm 0.842, dock 1.259
      # i.e. +33% yield for -0.005 iptm. The discarded 7-11 band had identical
      # pLDDT (0.798 vs 0.797) — well-folded, well-docked binders, not junk.
      hotspot_engagement_min: 0.75
      binder_rmsd_fold_max: 2.0
      binder_plddt_min: 0.75
      # ipsae_min is high-precision/low-recall: >0.5 is ~70% precise against the
      # Rosetta-validated set but recovers only ~4% of it. Kept OFF as a gate and
      # weighted heavily in the composite instead.
      ipsae_min_min: null
      iptm_min: 0.5
      iface_pae_max: 15.0
      require_no_clash: true
      # The clash gate is a DISTANCE, not a count. `clash_severe` counts
      # inter-chain heavy-atom pairs under 2.2 A and zero-tolerates them,
      # which conflates genuine overlaps (carbonyl oxygens at 0.95 A,
      # guanidinium nitrogens at 1.17 A) with salt bridges modelled 0.6-0.9 A
      # too short (Arg NH against Asp OD at 2.05-2.15 A; a real one is
      # 2.7-3.0 A). Unable to tell them apart, it trips on ~40% of ANY single
      # prediction — RF3's own unselected base rate is 39.8% — so it measured
      # the draw rather than the design.
      #
      # Measured on pain_receptors_v3: 161 of 400 rejected designs (40.2%,
      # the largest single cause) failed on this check alone, having passed
      # every other gate. Across 4 predictors only 35 of 600 survived the
      # count under all four, against 281 under this distance floor.
      #
      # 1.8 A is where the two populations separate in the measured distance
      # histogram. It is NOT calibrated against binding, so it distinguishes
      # two kinds of modelling error rather than good binders from bad.
      # Set to null to restore the old zero-tolerance count; a campaign
      # scored before this column existed falls back to it automatically.
      min_contact_min: 1.8
      # ---- molecular glue (design_intent: stabilize) -------------------
      # All three MUST stay null unless this is a glue run. These columns are
      # blank on every other campaign, and a record missing a criterion's
      # column FAILS it — so a non-null value here drops every design and the
      # run reads as a bad target rather than a bad config. Measured on 1,352
      # real 3KYS records: 317 survivors -> 0 with a glue gate at 0.5.
      # `filter_records` warns by name if one is set and nothing carries the
      # column, but the default is what keeps it from happening.
      #
      # min_side is the gate that tells a glue from a competitive binder that
      # grabbed one partner — the pooled hotspot_engagement_min above cannot.
      hotspot_engagement_min_side_min: null
      # Against the campaign's own apo fold. The absolute glue_ipsae_ab is
      # deliberately NOT gateable: a well-folded native interface scores high
      # with or without a binder.
      glue_ipsae_delta_min: null
      # Computed over the whole assembly since the merge, so a refold whose
      # partner slips out of the groove shows up in it. Null globally because
      # no disrupt campaign was ever gated on it.
      target_rmsd_max: null
    weights:
      ipsae_min: 2.0
      neg_binder_rmsd_dock: 1.5
      binder_plddt: 1.5
      iptm: 1.0
      neg_iface_pae: 1.0
      epitope_recall: 1.0
      hotspot_engagement: 0.5
      # A scored liability, not a gate: how much more of a design's interface
      # sits on the fresh hydrophobic patch the TRIM opened than the patch's
      # own size predicts (1.0 = exactly as often as chance). Zero for every
      # design in the usual case, because most trims are no-ops and expose
      # nothing at all -- and a zero-variance column z-scores to zeros, so it
      # then contributes nothing rather than a constant.
      #
      # 0.5 is a tie-breaker weight, and that is the whole of what the
      # measurement supports. Phase B refolded 1,784 designs over 143 matched
      # pairs and found NO detectable quality cost to patch-heavy designs at
      # matched total contacts (gate-pass ratios 1.125 [0.711-1.781] and 0.882
      # [0.488-1.597]) -- but the patch contacts SURVIVE refolding (1.000 in
      # five of seven arms), so they are real binding to an artificial
      # surface. Real liability, unmeasured magnitude. See
      # GLUE_PIPELINE_SCOPE.md "Phase B -- COMPLETE", and note that the trim's
      # own exposure refusals stay: Phase B held total contacts fixed, so it
      # never tested whether EXPOSING a patch costs anything.
      neg_patch_enrichment: 0.5
    # Cap on any single metric's contribution to the composite, in standard
    # deviations (null disables). The composite is an unbounded weighted z-sum,
    # so before this a design 3 SD clear on ipsae_min banked +6.0 at weight 2.0
    # and no realistic deficit elsewhere could offset it -- the top-K filled
    # with one-metric specialists. Learned from BoltzGen's own ranker, which is
    # a MAXIMIN over six per-metric ranks (judged by your WORST metric) and is
    # measurably a strong selector: on a 994-design campaign its top-100 had a
    # median dock RMSD of 3.12 A / 94% under 5 A, versus 8.89 A / 16.3% over
    # the full set and 8.01 A / 29% for iPTM-ranking. 2.0 is ~the 2.3/97.7
    # percentile of a normal, so it touches outliers only.
    z_clip: 2.0
    mmr: {lambda_: 0.5, seq_identity_cap: 0.7}

    # PyRosetta interface metrics. Run ONLY on designs that already cleared the
    # confidence and geometry gates above, and folded only into the final
    # composite — never into the gate. Rosetta cannot tell a real complex from a
    # confidently wrong one: a mis-docked binder is still a physical pose, so
    # relax and InterfaceAnalyzer return well-defined numbers that mean nothing.
    # Gating first is also what makes it affordable (~10-30 s per design).
    rosetta:
      enabled: true
      max_designs: 300       # the tail is not worth the linear cost
      relax: true
      weights:               # merged over the weights above for the final rank
        neg_rosetta_ddg: 1.5
        rosetta_cms: 1.0
        # Buried unsatisfied polars CREATED by binding (complex - binder -
        # target, clamped >= 0): polars the interface buries without satisfying,
        # which cost real affinity. Raised 0.5 -> 1.0 so a design cannot buy a
        # good ddG by burying unsats -- the same reasoning as the worker's own
        # `iface_score = ddg + w * vbuns`.
        #
        # Deliberately NOT paired with a positive weight on `hbonds_int` or
        # `rosetta_sbuns`: counting FAVOURABLE H-bonds and salt bridges off a
        # predicted structure over-trusts sidechain placement, and `sbuns` is
        # the sidechain-only subset of `vbuns`, so weighting both double-counts.
        # A liability we can be confident about is worth more than a reward we
        # cannot. Both stay reported columns.
        neg_rosetta_vbuns: 1.0
    # The n_seq sequences sharing one RFD3 backbone are near-duplicates; without
    # this cap a top-20 comes from a handful of backbones.
    max_per_backbone: 1
    top_k: 20
    # How a production campaign is SIZED. Per 1000 RFD3 backbones, measured
    # across two complete campaigns:
    #     ipsae_min > 0.5 + gates    2.5 (8TAC)   0.1 (CD79b)
    #     iPTM      > 0.7 + gates   13.2 (8TAC)   2.0 (CD79b)
    # ipsae_min is a 5-20x rarer event, so a trial-sized sample cannot measure
    # it; iPTM is the practical sizing metric. ipsae_min is still computed on
    # every design and carries the heaviest weight in the ranking below.
    #
    # The gates are not optional: of designs with iPTM > 0.7, only 45% (8TAC)
    # and 8% (CD79b) are actually docked on target.
    success_metric: iptm       # iptm | ipsae_min
    target_designs: 50         # 100 when success_metric is ipsae_min
    excellence_bar: 0.7        # 0.5 when success_metric is ipsae_min
    # Kept for reference: the calibrated ipsae_min bar. The best ipsae_min ever
    # produced was 0.640 (8TAC) / 0.684 (CD79b) at the time this was written —
    # but KRAS/RAF1 later hit 0.931, so "unreachable" is target-dependent, not
    # a fact about ipsae_min itself. That is what adaptive_bar is for.
    excellence_ipsae_min: 0.5
    # On by default: before sizing at excellence_bar, walk the same bar ladder
    # suggested_bar is drawn from (strictest first) and raise to the strictest
    # rung that both has >= MIN_HITS_FOR_ESTIMATE hits and still fits the GPU
    # budget at its pessimistic bound. An unusually good target (e.g. KRAS/RAF1,
    # ipsae_min up to 0.93) gets sized to a correspondingly tighter bar instead
    # of the same fixed default every target gets; a marginal target falls
    # straight through to today's behaviour unchanged. Never lowers the bar.
    adaptive_bar: true

  # Domain-aware target truncation (src/structure_trim.py).
  trim:
    # Optional. Absent binaries degrade to RCSB annotations + the geometric
    # partition, logged loudly. Foldseek CANNOT parse domains — it is here for
    # the post-trim fold check and ranking diversity.
    chainsaw_cmd: null
    foldseek_bin: null
    min_bsa_retention: 0.90

  workstation:
    # Absolute path to the boltzgen entry point. The shebang on this script
    # carries its own venv's Python, so we can invoke it directly without
    # activating the env or going through `uv run`. Machine-specific — set
    # via LPT_BOLTZGEN_EXECUTABLE instead (see .env.example and
    # docs/environment_setup.md).
    # Both keys are read by the BRIDGED BoltzGen stages
    # (`_boltzgen_backend`), not by anything retired. `timeout_hours` was the
    # legacy `src/design_runner.py` subprocess timeout and went with it on
    # 2026-09-13; the bridged path polls a detached campaign from disk counts
    # instead and has no single blocking call to time out.
    boltzgen_executable: null
    cuda_device: 0

  # Campaign sizes for BoltzGen on the BINDER track, mirroring
  # design.foundry's {pilot, calibration, production} shape. Counts are DESIGNS
  # (BoltzGen's own unit) rather than RFD3 batches — there is no funnel here,
  # so one unit of work is one scored design.
  boltzgen:
    # Proves the spec runs before anything big. 24 is enough to catch a
    # malformed spec and to sample several binder lengths, which is what
    # surfaced BoltzGen's equal-length crash (2 of 24 designs hit it).
    pilot:       {num_designs: 24,    budget: 8}
    # Must produce >= MIN_HITS_FOR_ESTIMATE (5) designs above the bar or the
    # verdict is "enlarge the sample" every time. Measured on RAMP1 cyclic: at
    # the gated 1.21% rate, 994 designs gave 12 hits, so ~1000 is the smallest
    # size that reliably clears 5. Cheap for a macrocycle (3.1 GPU-h at 130
    # tokens) and much more for a mini-protein — but the driver there is
    # COMPLEX SIZE, not the protocol. The protein protocol adds only ~18%
    # (boltzgen_runner.PROTEIN_PROTOCOL_FACTOR = 1.175); going from a
    # 130-token macrocycle complex to a 285-token YAP1/TEAD1 one takes
    # 11 s/design to 37, i.e. 10.3 GPU-h for the same 1000 designs. Lower it
    # only knowing the interval widens and most verdicts become ITERATE — at
    # the measured ~1.1% gated rate, 450 designs is where 5 hits stops being
    # expected.
    calibration: {num_designs: 1000,  budget: 100}
    # A CEILING, not the plan: `_resolve_boltzgen_production` sizes production
    # from the calibration's measured rate and clamps to this and to the disk
    # budget. 10,000 designs is ~22 GPU-h of macrocycle at 99 tokens.
    production:  {num_designs: 10000, budget: 200}

  # ── BoltzGen as a BINDER-TRACK backend ────────────────────────────────────
  # Distinct from the `thresholds` / `ranking` blocks below, which belonged to
  # the retired legacy PPI BoltzGen stages (design -> execution -> analysis)
  # and gated LPT-computed `lpt_*` columns as well as BoltzGen's own. Of those
  # two, only `ranking.top_k` and the `thresholds` block still have a reader —
  # see the notes on each.
  #
  # This block gates BoltzGen's OWN scoring only, and exists because that
  # scoring turned out to be good: BoltzGen ranks by MAXIMIN over six
  # per-metric ranks (a design is judged by its WORST), and measured on a
  # 994-design cyclic campaign its top-100 had a median design-vs-refold dock
  # RMSD of 3.12 A with 94% under 5 A, against 8.89 A / 16.3% over the full set
  # and 8.01 A / 29% for iPTM-ranking. So the backend keeps its own ranking and
  # LPT supplies only the gate and the sizing bar.
  #
  # PER-MODALITY, because one scalar demonstrably cannot serve both: across
  # archived cyclic runs `lpt_hotspot_sasa_delta` spans 0-24.7 A^2 against
  # 190-430 for mini-proteins, and `complex_plddt >= 0.70` passes 3.7% of
  # cyclic designs against essentially all mini-protein ones. `modality:`
  # entries are merged OVER `thresholds:`; an absent key inherits.
  boltzgen_ranking:
    # Applied to every modality.
    thresholds:
      # BoltzGen's own composite filter, and the single most informative column
      # it writes: it is dominated by `filter_rmsd <= 2.0 A` (886 of 909
      # rejections on the 994-design run), which is a design-vs-refold
      # self-consistency check -- its version of `binder_rmsd_fold`. On the
      # archived cyclic run 82 of the 85 designs passing it were ALSO docked
      # within 5 A, i.e. it is very nearly a pure dock-correctness gate.
      require_boltzgen_pass: true
      # min_design_to_target_pae. TARGET-DEPENDENT rather than loose or strict:
      # passes 99.7% on RAMP1 cyclic and dropped 57% on the mesothelioma run.
      # Kept as a ceiling that bites only where it is meaningful.
      ipae_max: 10.0
      # complex_plddt. Deliberately OFF: >= 0.70 passes only 3.7% of cyclic
      # designs and collapses a 64-hit `iptm >= 0.50` set to ZERO, so promoting
      # it to a gate would silently empty every macrocycle campaign.
      plddt_min: null
    # How a campaign is SIZED, mirroring design.binder_ranking's vocabulary.
    success_metric: iptm      # design_to_target_iptm
    target_designs: 50

    modality:
      cyclic_peptide:
        # The GATE stays the base one (pass_filters + ipae) and iptm does its
        # work as the sizing BAR, so the two express different things -- a floor
        # for "is this a valid design" and a standard for "is this a good one",
        # the same split `design.binder_ranking` uses. Setting both to 0.50 made
        # them redundant.
        #
        # MEASURED on 994 designs against RAMP1 (3N7S chain D). iptm alone:
        # >= 0.50 gives 64 hits (6.44%, 95% CI 5.07-8.14) -- comfortably
        # measurable; 0.55 gives 13; 0.60 gives 3, below MIN_HITS_FOR_ESTIMATE
        # and so unmeasurable even at n=1000. So 0.50 is the strictest
        # defensible bar for this modality.
        #
        # WITH the gate, which is the rate that actually sizes a campaign,
        # 12 of 994 designs are both self-consistent AND above the bar: 1.21%.
        # Sizing 50 such designs at the Wilson-pessimistic rate needs ~7,200
        # designs, about 16 GPU-h at 99 tokens. The iptm-only 6.44% would size
        # it at ~990 designs and 2.2 GPU-h, i.e. under-cost it 7x -- the gated
        # rate is the honest one.
        excellence_bar: 0.50
      mini_protein:
        # NO OVERRIDES, and that is now a MEASUREMENT rather than an
        # inheritance by default. The matching 994-design mini-protein
        # campaign against the same target (RAMP1, 3N7S chain D, 70-83mer)
        # lands within noise of the cyclic one on the rate that actually sizes
        # a campaign: 11/994 = 1.11% (95% CI 0.62-1.97) clear the base gate
        # AND the 0.50 bar, against cyclic's 12/994 = 1.21% (0.69-2.10). So
        # 0.50 is the strictest defensible bar here too -- 0.55 gives 3 hits,
        # below MIN_HITS_FOR_ESTIMATE.
        #
        # The two modalities differ on the pieces, not the product, which is
        # why the base block is right for both:
        #   pass_filters   20.32% mini  vs   8.55% cyclic
        #   ipae <= 10     82.7% of passers  vs 100% (it does real work here)
        #   plddt >= 0.70  39.3%            vs   3.7% (still no reason to gate)
        # A 24-design probe of this same campaign had suggested otherwise
        # (iptm 0.123-0.448, median 0.215); the at-scale distribution is
        # 0.118-0.665, median 0.234. Probes size nothing.
        thresholds: {}

  # RETIRED GATE, KEPT FOR ONE READER. These were the legacy PPI chain's hard
  # filters (`design_ranking.filter_records` at the analysis stage). No live
  # stage reads them: the bridged BoltzGen path gates on
  # `design.boltzgen_ranking.thresholds` and foundry on
  # `design.binder_ranking.thresholds`.
  #
  # It survives because `src/ppi_report.py` reads `iptm_min` and
  # `hotspot_sasa_delta_min` (:456-457) to draw the gate marker lines on the
  # histograms of the two ARCHIVED legacy runs in `outputs/` — the only runs
  # that renderer can render. Its in-code fallbacks happen to equal these
  # values today, so deleting the block would not move a marker *now*; it
  # would silently make the archived reports depend on two literals in
  # `ppi_report` instead, where the next edit to either has nothing to
  # disagree with. `tests/test_design_ranking_regression.py` also reads this
  # block as the shipped-defaults contract for `filter_records`, which is
  # still live (`ppi_report` calls it). Both go together at step 5 of
  # LEGACY_RETIREMENT_SCOPE.md, or not at all.
  #
  # Columns refer to entries on the enriched design records (boltzgen-native
  # or lpt_-prefixed; see src/design_metrics.py).
  thresholds:
    iptm_min: 0.60                  # design_to_target_iptm (higher = better)
    ipae_max: 10.0                  # min_design_to_target_pae (lower = better)
    hotspot_sasa_delta_min: 30.0    # lpt_hotspot_sasa_delta (Å² occluded; higher = better)
    require_boltzgen_pass: true     # require pass_filters == True from boltzgen's filter step

  # ONE LIVE KEY. `enrich_top_k`, the composite `weights` and the `mmr` block
  # were the legacy PPI analysis stage's and went with it on 2026-09-13.
  # `top_k` is read by the BRIDGED BoltzGen scoring stage
  # (`pipeline_runner._stage_boltzgen_scoring`, :4345) — deleting the block would
  # silently re-default it to 20 rather than fail.
  ranking:
    top_k: 20

  pyrosetta:
    # PyRosetta is OPTIONAL. It is used in exactly two places, both AFTER
    # designs already exist, and never to generate anything:
    #   * PPI track    — per-design hotspot SASA (burial of the target's
    #                    hotspot residues), in stage 5 analysis;
    #   * binder track — relax + InterfaceAnalyzer on designs that already
    #                    passed the geometric gates, in binder_scoring.
    # Both tracks run end-to-end without it; you lose those metrics and the
    # filters/weights that use them, nothing else.
    #
    #   auto  (default) use it when an interpreter is configured and present,
    #                   otherwise skip those steps with a warning, note the
    #                   skip in the stage report, and do NOT apply the
    #                   hotspot_sasa filter (rather than failing every design
    #                   for a metric that was never computed).
    #   true            require it — fail loudly at the point of use if it is
    #                   not configured. Use this for a reproducible campaign
    #                   where a silently different ranking rubric is worse
    #                   than a failed run.
    #   false           never use it, even if installed.
    #
    # NOTE: PyRosetta is free for academic / non-commercial use only.
    # Commercial use needs a licence — see docs/pyrosetta_setup.md.
    enabled: auto

    # PyRosetta runs in its own conda env (Python 3.11) because the
    # installed pyrosetta build is ABI-incompatible with the LPT venv's
    # Python. src/pyrosetta_sasa.py subprocesses scripts/_sasa_worker.py
    # under this interpreter; results come back as JSON on stdout.
    # Machine-specific — set via LPT_PYROSETTA_PYTHON instead (see
    # .env.example and docs/environment_setup.md).
    python_executable: null
    init_flags: "-mute all -ignore_unrecognized_res -load_PDB_components false"

  # Hard ground rules for what the pipeline will design against. The
  # structure stage surfaces per-chain residue counts to the LLM in the
  # structure_query so it can pick a chain within bounds (or recommend
  # cropping). The binder size ranges below are baked into the BoltzGen
  # YAML's `sequence: <min>..<max>` slot by `src/boltzgen_spec.py`, and into
  # the RFD3 contig's diffused-binder length by `src/foundry_spec.py`.
  constraints:
    # BoltzGen + structure prediction scale with target residue count.
    # Above max_target_residues the design pass rate drops and GPU memory
    # pressure increases. Smaller is generally better.
    max_target_residues: 500     # hard upper limit — flag any chain above
    target_residues_warn: 250    # softer threshold — note in query as suboptimal
    binder_sizes:
      cyclic_peptide:
        min: 12
        max: 15
      mini_protein:
        min: 70
        max: 86
