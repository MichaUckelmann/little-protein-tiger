[project]
name = "little-protein-tiger"
version = "0.1.0"
description = "Literature corpus pipeline and expert skill execution for protein/structure research."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "anthropic>=0.40",
    "pymupdf>=1.24",
    "lxml>=5.0",
    "lancedb>=0.20",
    "sentence-transformers>=3.0",
    "fastmcp>=2.0",
    "networkx>=3.0",
    "gemmi>=0.7",
    "biopython>=1.85",
    "biotite>=1.7.1",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.18",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "cryptography>=42.0",
    "authlib>=1.3",
    "python-jose[cryptography]>=3.3",
    "sse-starlette>=1.8",
    "slowapi>=0.1.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
