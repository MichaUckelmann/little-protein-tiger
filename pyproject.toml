[project]
name = "little-protein-tiger"
version = "0.1.0"
description = "Literature corpus pipeline and expert skill execution for protein/structure research."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
authors = [
    {name = "Michael Uckelmann", email = "micha.uckelmann@gmail.com"},
]
# Upper bound deliberately: LPT is an application, not a library, and a Python
# minor release HAS already changed behaviour under it — 3.13 turned on
# ssl.VERIFY_X509_STRICT, which breaks downloads behind a TLS-inspecting proxy
# (see src/env_config.relax_x509_strict). 3.12 and 3.13 are both tested in CI;
# 3.14 is allowed on the assumption it behaves, and the bound stops an untested
# 3.15 from silently becoming the default interpreter on someone's machine.
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "anthropic>=0.40",
    "pymupdf>=1.24",
    "lxml>=5.0",
    "fastmcp>=2.0",
    "networkx>=3.0",
    "gemmi>=0.7",
    "biopython>=1.85",
    "biotite>=1.7.1",
    "markdown>=3.6",
    # Direct imports in src/ that happened to arrive via lancedb /
    # sentence-transformers / biotite. Relying on a transitive edge means a
    # dependency bump can break structure_tools and binder_ranking silently.
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
# Semantic corpus search. Split out because sentence-transformers pulls torch
# and the full NVIDIA CUDA stack — 283 wheels, ~3 GB downloaded, ~5.7 GB
# installed — on every machine, including laptops that will never touch a GPU.
# Everything except `search_corpus` and the literature-db MCP server runs
# without it: structure tools, both design tracks, and both report generators.
corpus = [
    "lancedb>=0.20",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/MichaUckelmann/little-protein-tiger"

[project.scripts]
lpt-run-pipeline = "scripts.run_pipeline:main"
lpt-run-skill = "scripts.run_skill:main"
lpt-fetch-papers = "scripts.fetch_papers:main"
lpt-curate-papers = "scripts.curate_papers:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `scripts` is a package (it has __init__.py) and backs the console scripts
# below; without it every `lpt-*` command dies with ModuleNotFoundError. An
# editable install hides this because it puts the repo ROOT on sys.path.
packages = ["src", "scripts"]

# Runtime data read via `Path(__file__).parent.parent / <name>`:
#   src/binder_report.py, src/ppi_report.py -> assets/vendor/molstar
#   src/skill_runner.py                     -> skills/<name>/SKILL.md
# Installed alongside the packages so those lookups resolve the same way in a
# wheel as in a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"
"assets" = "assets"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: hits a live external API (RCSB / UniProt). Deselected by default; run with '-m network'",
]
# The chain-assignment and hotspot-grounding guards are ABOUT real structures,
# so a handful of tests genuinely reach RCSB/UniProt. They stay in the suite but
# out of the default run, which must be hermetic.
addopts = "-m 'not network'"
