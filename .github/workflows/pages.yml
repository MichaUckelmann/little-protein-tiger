# Publish docs/ to GitHub Pages, so the showcase walkthroughs have public URLs
# that can be linked, embedded and unfurled into link previews.
#
# The pages themselves are static and pre-built (docs/showcase/*.html are
# committed), so this workflow only uploads — it does not run the builders.
# Regenerate them locally with `python docs/showcase/build_*.py` and commit the
# result when a run changes.
#
# Pages cannot be enabled on a private repo without a paid plan, so this job is
# SKIPPED while the repo is private rather than failing. Without that guard it
# went red on every push touching docs/ — `configure-pages` returns "Get Pages
# site failed ... Not Found" — and a permanently-red Actions tab is how a real
# Tests failure gets scrolled past.
#
# `enablement: true` is kept because it is harmless, but it CANNOT create the
# site: GITHUB_TOKEN is refused with "Create Pages site failed. Error: Resource
# not accessible by integration" — the create-a-Pages-site endpoint needs admin
# rights the Actions token does not get. So Pages does have to be turned on once
# by a human (Settings -> Pages -> Source: "GitHub Actions"), or once via the
# API with an admin token:
#
#   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
#
# Done for this repo on 2026-09-09. Note also that going public does not
# retrigger anything — workflows fire on push — so the first deploy after a
# visibility flip needs a push touching docs/ or `gh workflow run Pages`.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
