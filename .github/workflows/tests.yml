name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run tells you nothing once a newer commit exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is supported, so it is tested — not assumed. It already differs
        # from 3.12 in TLS behaviour (VERIFY_X509_STRICT), which is exactly the
        # kind of thing a single-version matrix hides.
        python-version: ["3.12", "3.13"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # The suite is green without this (tests that need it skip), but skipping
      # is not the same as passing. ~60 MB, public, no credentials.
      #
      # `--with-structures` is the second half and was missing: this step's
      # comment used to claim it made the chain-assignment and
      # hotspot-grounding guards run, and it did not — those read mmCIF files
      # off disk and the script fetched only UniProt and HGNC, so 19 tests
      # skipped here every run. That includes the two pinning the 3KYS A344
      # palmitoyl-cysteine lesson, which cost a real campaign ten RFD3 aborts.
      - name: Fetch reference data
        run: python scripts/fetch_reference_data.py --with-structures

      - name: Run tests
        run: pytest tests/ -q

      - name: Report what skipped
        if: always()
        run: pytest tests/ -q -rs | tail -40

  # The editable install used above puts the repo ROOT on sys.path, which hides
  # a whole class of packaging bug: `scripts/`, `skills/` and `assets/` are not
  # in the wheel, so the console-script entry points and every runtime asset
  # lookup break for anyone who runs `pip install little-protein-tiger`. Build
  # the real artifact and exercise it from a clean venv.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install the wheel into a clean venv and exercise it
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet dist/*.whl
          echo "--- console scripts ---"
          /tmp/wheeltest/bin/lpt-run-pipeline --help > /dev/null
          /tmp/wheeltest/bin/lpt-run-skill --help > /dev/null
          /tmp/wheeltest/bin/lpt-fetch-papers --help > /dev/null
          /tmp/wheeltest/bin/lpt-curate-papers --help > /dev/null
          echo "--- packaged assets resolve outside a source checkout ---"
          cd /tmp && /tmp/wheeltest/bin/python -c "
          from pathlib import Path
          import src.binder_report as br, src.skill_runner as sr
          assert br._MOLSTAR_DIR.is_dir(), f'vendored Mol* missing: {br._MOLSTAR_DIR}'
          skills = Path(sr.__file__).resolve().parent.parent / 'skills'
          assert skills.is_dir(), f'skills/ missing from the wheel: {skills}'
          print('ok')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          # Non-blocking for now: the codebase predates any linter, so this
          # reports without failing the build. Tighten once the backlog is
          # cleared.
          ruff check . --output-format=github || true
